# K5: the kernel occupies mtd1. Every long hold resets Wi-Fi only.
DEVICE=auto
KEY_ENTER TIMED_FIRE 0.1 play /usr/share/sounds/chime_3.opus
KEY_ENTER TIMED 0.1 tell %ip
KEY_ENTER TIMED_FIRE 5 play /usr/share/sounds/chime_1.opus
KEY_ENTER TIMED 5 wlan reset && k5-reboot
KEY_ENTER TIMED_FIRE 20 play /usr/share/sounds/chime_2.opus
KEY_ENTER TIMED 20 wlan reset && k5-reboot
